    <link rel="icon" type="image/jpeg" href="/images/logo.jpg" />

    <!-- Generic SEO fallback for routes that aren't prerendered (admin, cart, etc — all noindex).
         URL-specific tags (canonical, og:url, og:image, twitter:image) are intentionally NOT here:
         they would duplicate the per-route Helmet tags and Google ignores duplicate canonicals.
         Per-route SEO is rendered at build time by scripts/prerender.mjs via react-helmet-async. -->
    <title>Palletoori Vuragayalu — Andhra Pickles, Sweets &amp; Snacks Online</title>
    <meta name="description" content="Authentic homemade Andhra pickles, sweets &amp; karappodulu. Avakaya, Gongura, Putharekulu — cold-pressed oils, no preservatives. Order online in India." />
    <meta name="author" content="Palletoori Vuragayalu" />
    <!-- robots is intentionally omitted: Seo.jsx emits index/noindex per route. Duplicating
         it here would cause conflicting directives (and Google takes the most restrictive). -->

    <!-- Google Search Console site verification — must remain even after verification succeeds. -->
    <meta name="google-site-verification" content="iR2AllF05CQDkdlew_LLR78XmjzcGKQlSnPFQoUYVtU" />
